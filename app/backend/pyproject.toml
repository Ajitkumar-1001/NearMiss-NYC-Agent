[project]
name = "nearmiss"
version = "0.1.0"
description = "NearMiss NYC — explainable street-conflict decision support"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["nearmiss*"]

# Load-bearing. The dashboard is a package data file, not a module, so without
# this it is dropped by `pip install` and `GET /` 500s in the container while
# working fine from a source checkout.
[tool.setuptools.package-data]
nearmiss = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["../../tests"]
